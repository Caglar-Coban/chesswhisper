name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev and web dependencies
        run: pip install -e ".[dev,web]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests with coverage
        run: pytest -v --cov --cov-report=term --cov-report=json

      - name: Report coverage
        if: always()
        shell: bash
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          totals = json.load(open("coverage.json"))["totals"]
          print(f"Coverage: {totals['percent_covered']:.1f}% of {totals['num_statements']} statements")
          EOF

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package with dev, web and postgres dependencies
        run: pip install -e ".[dev,web,postgres]"

      - name: Run the tests against PostgreSQL
        env:
          CHESSWHISPER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t chesswhisper .

      - name: Serve from the image and answer a request
        run: |
          docker run -d --name cw -p 127.0.0.1:8000:8000 chesswhisper
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/login >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/login | grep -q chesswhisper
          docker exec cw stockfish quit
          docker exec cw chesswhisper --version
          docker logs cw
          docker rm -f cw
