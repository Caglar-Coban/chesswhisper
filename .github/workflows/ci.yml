name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev and web dependencies
        run: pip install -e ".[dev,web]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t chesswhisper .

      - name: Serve from the image and answer a request
        run: |
          docker run -d --name cw -p 127.0.0.1:8000:8000 chesswhisper
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/login >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/login | grep -q chesswhisper
          docker exec cw stockfish quit
          docker exec cw chesswhisper --version
          docker logs cw
          docker rm -f cw
