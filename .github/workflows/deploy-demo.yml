name: Deploy demo

# Publishes the app to a Hugging Face Space as the public demo. Needs a
# repository variable HF_SPACE (e.g. "your-hf-name/chesswhisper") and a secret
# HF_TOKEN (a Hugging Face token with write access); without them the job is
# skipped. The Space builds deploy/huggingface/Dockerfile, which seeds the
# demo account at build time.
on:
  push:
    branches: [master]
    paths: ["src/**", "pyproject.toml", "deploy/huggingface/**", ".github/workflows/deploy-demo.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Assemble the Space
        run: |
          mkdir space
          cp -r src pyproject.toml LICENSE space/
          cp deploy/huggingface/Dockerfile deploy/huggingface/README.md space/
          find space -name __pycache__ -prune -exec rm -rf {} +

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              folder_path="space",
              repo_id=space,
              repo_type="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns=["src/**"],
          )
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          EOF
