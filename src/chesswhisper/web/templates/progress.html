{% extends "base.html" %}
{% block title %}chesswhisper — {{ t("title.progress") }}{% endblock %}
{% block content %}
<div class="card">
  <p id="progress-text">{{ t("progress.starting") }}</p>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
  </div>
  <div class="banner error" id="error-banner" style="display: none;">
    <strong>{{ t("progress.error") }}</strong> <span id="error-message"></span>
    <p><a class="back-link" href="/">&larr; {{ t("progress.new_analysis") }}</a></p>
  </div>
</div>
<script>
  var jobId = "{{ job_id }}";
  var TEXT = { starting: {{ t("progress.starting") | tojson }}, count: {{ t("progress.count") | tojson }} };

  function poll() {
    fetch("/analyze/status/" + jobId)
      .then(function (response) {
        // A logged-out session gets redirected to the login page, not JSON.
        if (response.redirected) {
          window.location.replace(response.url);
          return null;
        }
        return response.json();
      })
      .then(function (data) {
        if (data === null) {
          return;
        }
        if (data.status === "running") {
          document.getElementById("progress-text").textContent =
            data.total > 0
              ? TEXT.count.replace("{completed}", data.completed).replace("{total}", data.total)
              : TEXT.starting;
          var pct = data.total > 0 ? Math.round((data.completed / data.total) * 100) : 0;
          document.getElementById("progress-fill").style.width = pct + "%";
          setTimeout(poll, 1000);
        } else if (data.status === "done") {
          window.location.replace(data.redirect);
        } else if (data.status === "error") {
          document.getElementById("progress-text").style.display = "none";
          document.getElementById("error-banner").style.display = "block";
          document.getElementById("error-message").textContent = data.message;
        }
      })
      .catch(function () {
        setTimeout(poll, 1000);
      });
  }
  poll();
</script>
{% endblock %}
