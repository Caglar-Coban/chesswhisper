[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chesswhisper"
version = "0.2.0"
description = "Stockfish + LLM chess coaching: turns your games into a coaching report, from the command line or a small web UI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Caglar Coban" }]
requires-python = ">=3.11"
keywords = ["chess", "stockfish", "llm", "cli", "coaching", "lichess", "chess-com", "pgn", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "python-chess>=1.11",
    "click>=8.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "requests>=2.31",
    "platformdirs>=4.0",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/Caglar-Coban/chesswhisper"
Issues = "https://github.com/Caglar-Coban/chesswhisper/issues"
Changelog = "https://github.com/Caglar-Coban/chesswhisper/blob/master/CHANGELOG.md"

[project.scripts]
chesswhisper = "chesswhisper.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "jinja2>=3.1", "markdown>=3.6", "bleach>=6.1", "sqlalchemy>=2.0", "bcrypt>=4.0", "cryptography>=42", "itsdangerous>=2.1", "alembic>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/chesswhisper"]
artifacts = ["src/chesswhisper/data/eco.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["chesswhisper"]
# Alembic's env.py only runs inside Alembic's own command machinery.
omit = ["*/web/migrations/env.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are common in this codebase's report/prompt strings

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom requires calling Depends(...) as an
# argument default; this is not the antipattern B008 warns about.
"src/chesswhisper/web/*.py" = ["B008"]
"tests/test_web_auth.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
